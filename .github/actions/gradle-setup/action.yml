name: Gradle setup
description: JDK, Gradle caching and a worker count that matches the runner's CPUs.

inputs:
  debug-keystore-base64:
    description: Persistent debug signing key (unavailable on fork pull requests).
    required: false
  require-debug-key:
    description: Refuse to build distributable debug APKs without the persistent key.
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        # Matches gradle/gradle-daemon-jvm.properties (Temurin 25), so Gradle uses it instead of downloading one.
        java-version: 25

    - uses: ./.github/actions/debug-signing
      with:
        keystore-base64: ${{ inputs.debug-keystore-base64 }}
        require-key: ${{ inputs.require-debug-key }}

    - uses: gradle/actions/setup-gradle@v5

    - name: Match Gradle workers to the runner's CPUs
      # gradle.properties pins workers.max for small dev machines; the user-home file wins over it.
      shell: bash
      run: |
        mkdir -p ~/.gradle
        echo "org.gradle.workers.max=$(nproc)" >> ~/.gradle/gradle.properties
        echo "Gradle workers: $(nproc)"

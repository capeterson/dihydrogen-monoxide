name: Instrumented tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: instrumented-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  managed-device:
    name: pixel6Api34DebugAndroidTest (Gradle Managed Device, aosp-atd)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        # The hosted runner has little free space once the SDK and Gradle caches are in; the emulator's userdata
        # partition alone needs about 7.3 GB and the managed device otherwise fails with
        # "Not enough space to create userdata partition".
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/local/share/powershell /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: ./.github/actions/gradle-setup
        with:
          debug-keystore-base64: ${{ secrets.DHMO_DEBUG_KEYSTORE_BASE64 }}

      - name: Run instrumented tests on the managed device
        # One module at a time: each managed device boots its own ~2.5 GB emulator, and two at once exhausted the
        # runner's memory (the job was killed with exit code 143).
        run: |
          set -o pipefail
          for module in :app :core:database; do
            ./gradlew "$module:pixel6Api34DebugAndroidTest" -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect 2>&1 | tee -a managed-device.log
          done
        shell: bash

      - name: Upload androidTest reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: android-test-reports-managed-device
          path: |
            managed-device.log
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          if-no-files-found: ignore

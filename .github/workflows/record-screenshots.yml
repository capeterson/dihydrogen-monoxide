name: Record screenshots

# Re-records the Roborazzi reference images on Linux (the CI image) and commits them to the branch it was
# dispatched on. Developers on other operating systems use this instead of committing local images.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # 21 is for Robolectric unit tests (Gradle toolchain); the last entry, 17, is the default JAVA_HOME.
          java-version: |
            21
            17

      - uses: gradle/actions/setup-gradle@v5

      - name: Record reference images
        run: ./gradlew recordRoborazziDebug

      - name: Commit changed images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '**/src/test/screenshots/**'
          if git diff --cached --quiet; then
            echo "No screenshot changes."
          else
            git commit -m "Update Roborazzi reference screenshots"
            git push
          fi

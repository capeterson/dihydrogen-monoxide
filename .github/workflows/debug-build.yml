name: Debug build

# Builds debug APKs for every merge to main and publishes them as a GitHub pre-release.
# Only the newest MAX_BUILDS debug releases are kept; older ones (and their tags) are deleted
# as part of each publication, so storage stays bounded.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialise publications so concurrent runs can't race on the trim step. Never cancel a run mid-publish.
concurrency:
  group: debug-build
  cancel-in-progress: false

permissions:
  contents: write # create releases/tags and delete old ones

env:
  MAX_BUILDS: 10
  TAG_PREFIX: debug-

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/gradle-setup
        with:
          debug-keystore-base64: ${{ secrets.DHMO_DEBUG_KEYSTORE_BASE64 }}
          require-debug-key: true

      - name: Assemble debug APKs
        run: ./gradlew assembleDebug

      - name: Collect APKs
        run: |
          short_sha="${GITHUB_SHA::7}"
          mkdir -p dist
          shopt -s nullglob
          for apk in app/build/outputs/apk/debug/*.apk wear/build/outputs/apk/debug/*.apk; do
            # Never publish an APK signed with an accidentally regenerated/default key.
            certificates="$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk")"
            digest="$(printf '%s\n' "$certificates" | sed -n 's/^.*certificate SHA-256 digest: //p')"
            if [[ "$digest" != "$DEBUG_CERT_SHA256" ]]; then
              echo "::error::Unexpected signing certificate for $apk"
              exit 1
            fi
            module="${apk%%/*}"
            cp "$apk" "dist/dhmo-${module}-debug-${GITHUB_RUN_NUMBER}-${short_sha}.apk"
          done
          ls -l dist
          [ -n "$(ls -A dist)" ] || { echo "No APKs were produced" >&2; exit 1; }

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="${TAG_PREFIX}${GITHUB_RUN_NUMBER}-${short_sha}"
          gh release create "$tag" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "Debug build #${GITHUB_RUN_NUMBER} (${short_sha})" \
            --notes "Debug APKs built from ${GITHUB_SHA} on main. Not for production." \
            --prerelease \
            --latest=false

      - name: Trim old debug builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest first; skip the MAX_BUILDS most recent, delete the rest along with their tags.
          gh release list --limit 1000 --json tagName,createdAt \
            --jq "map(select(.tagName | startswith(\"${TAG_PREFIX}\")))
                  | sort_by(.createdAt) | reverse
                  | .[${MAX_BUILDS}:][].tagName" |
          while read -r old_tag; do
            echo "Deleting $old_tag"
            gh release delete "$old_tag" --yes --cleanup-tag
          done

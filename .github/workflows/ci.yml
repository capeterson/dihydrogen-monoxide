name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Matches gradle/gradle-daemon-jvm.properties (Temurin 25), so Gradle uses it instead of downloading one.
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Static analysis
        run: ./gradlew ktlintCheck detekt checkModuleGraph --continue

      - name: Android lint
        run: ./gradlew lint --continue

      - name: Unit tests
        run: ./gradlew testDebugUnitTest :core:common:test :core:model:test :core:domain:test :core:backup:test --continue

      - name: Screenshot tests (Roborazzi, JVM)
        run: ./gradlew verifyRoborazziDebug

      - name: Assemble debug
        run: ./gradlew assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

      - name: Upload Roborazzi diffs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: roborazzi-diffs
          path: |
            **/build/outputs/roborazzi/**
            **/build/test-results/roborazzi/**
          if-no-files-found: ignore

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/detekt/**
          if-no-files-found: ignore

# Memory: one JVM does the Gradle work and the Kotlin compiles (no separate Kotlin daemon), SerialGC with a shrinking
# heap so idle daemons give memory back, and an idle timeout so they exit. Peak for a clean full unit-test build is
# about 3 GB (it was 4.2 GB with a 4 GB heap and a second Kotlin daemon). Override per machine in ~/.gradle/gradle.properties.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=640m -XX:+UseSerialGC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30 -Dfile.encoding=UTF-8
org.gradle.daemon.idletimeout=300000
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
ksp.incremental=true
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

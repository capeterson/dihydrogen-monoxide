# Builds upon the detekt 2.0.0-alpha.6 defaults (TECHNICAL_PLAN §3.8). No baseline: suppress with @Suppress and a comment.
style:
  MaxLineLength:
    maxLineLength: 140
  MagicNumber:
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/GoalPolicyV1.kt'
      - '**/theme/Color.kt'
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNamedArgument: true
    ignoreExtensionFunctions: true
    ignoreEnums: true
    ignoreAnnotation: true
    ignoreRanges: true
  UnusedPrivateFunction:
    ignoreAnnotated:
      - 'Preview'
  UnusedParameter:
    active: true

complexity:
  LongParameterList:
    allowedFunctionParameters: 8
    allowedConstructorParameters: 10
    ignoreDefaultParameters: true
    ignoreDataClasses: true
  LongMethod:
    ignoreAnnotated:
      - 'Composable'
  TooManyFunctions:
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/dao/**'
      - '**/*Repository.kt'
  CyclomaticComplexMethod:
    ignoreAnnotated:
      - 'Composable'

naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'
    excludes: ['**/test/**', '**/androidTest/**']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*'
